name: Device compatibility gate

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/check-upstream-support.sh"
      - ".github/workflows/device-compatibility.yml"
      - "docs/**"
      - "README.md"

permissions:
  contents: read

jobs:
  check-upstream-device:
    name: Verify exact upstream board support
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Check exact device definition
        run: bash scripts/check-upstream-support.sh
